<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create account | RoamCircle</title>
  <meta name="description" content="Create a RoamCircle account and set up your travel profile.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;700;800&family=Fraunces:opsz,wght@9..144,700;9..144,800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="auth-page">
  <main class="auth-layout signup-onboarding">
    <section class="auth-panel signup">
      <a class="brand" href="index.html">
        <span class="brand-mark">R</span>
        <span>RoamCircle</span>
      </a>
      <div>
        <p class="eyebrow">Create account</p>
        <h1>Build your traveler profile first.</h1>
        <p>RoamCircle uses these answers to publish your trip, recommend compatible travelers, and avoid fake assumptions.</p>
      </div>
    </section>

    <section class="auth-card onboarding-card" aria-label="Sign up form">
      <h2>Sign up</h2>
      <form class="auth-form" id="signup-form">
        <div class="field-row">
          <div class="field">
            <label for="name">Full name</label>
            <input id="name" name="name" placeholder="Your name" required>
          </div>
          <div class="field">
            <label for="email">Email</label>
            <input id="email" name="email" type="email" placeholder="you@example.com" required>
          </div>
        </div>

        <div class="field">
          <label for="password">Password</label>
          <input id="password" name="password" type="password" placeholder="Create a password" required>
        </div>

        <div class="form-section-label">Your first trip</div>
        <div class="field-row">
          <div class="field">
            <label for="source">From</label>
            <input id="source" name="source" placeholder="Mumbai" required>
          </div>
          <div class="field">
            <label for="destination">To</label>
            <input id="destination" name="destination" placeholder="Ladakh" required>
          </div>
        </div>

        <div class="field-row">
          <div class="field">
            <label for="trip-type">Trip type</label>
            <select id="trip-type" name="tripType">
              <option value="motorcycle">Motorcycle ride</option>
              <option value="roadtrip">Road trip</option>
              <option value="cycling">Cycling</option>
              <option value="hiking">Hiking / trekking</option>
              <option value="backpacking">Backpacking</option>
              <option value="train">Train journey</option>
            </select>
          </div>
          <div class="field">
            <label for="vehicle">Vehicle / gear</label>
            <input id="vehicle" name="vehicle" placeholder="Royal Enfield 350, trekking gear...">
          </div>
        </div>

        <div class="field-row">
          <div class="field">
            <label for="pace">Travel pace</label>
            <select id="pace" name="pace">
              <option value="relaxed">Relaxed</option>
              <option value="moderate" selected>Moderate</option>
              <option value="fast">Fast</option>
            </select>
          </div>
          <div class="field">
            <label for="budget">Budget per day</label>
            <select id="budget" name="budget">
              <option value="budget">Budget</option>
              <option value="mid" selected>Mid</option>
              <option value="comfort">Comfort</option>
            </select>
          </div>
        </div>

        <div class="field">
          <label for="habits">Habits and preferences</label>
          <textarea id="habits" name="habits" rows="4" placeholder="Early starter, vegetarian, non-smoker, camping okay, prefers hotels, carries toolkit..."></textarea>
        </div>

        <div class="field">
          <label for="meetpoints">Possible meet-up points</label>
          <input id="meetpoints" name="meetpoints" placeholder="Pune, Nashik, Manali">
        </div>

        <button class="button primary full" type="submit">Create account and continue</button>
      </form>
      <p class="auth-note">Already have an account? <a href="login.html">Log in</a></p>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
