<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Log in | RoamCircle</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;700;800&family=Fraunces:opsz,wght@9..144,700;9..144,800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="auth-page">
  <main class="auth-layout">
    <section class="auth-panel">
      <a class="brand" href="index.html">
        <span class="brand-mark">R</span>
        <span>RoamCircle</span>
      </a>
      <div>
        <p class="eyebrow">Welcome back</p>
        <h1>Log in to your trip circle.</h1>
        <p>Continue planning itineraries, reviewing matches, and coordinating upcoming travel crews.</p>
      </div>
    </section>

    <section class="auth-card" aria-label="Login form">
      <h2>Log in</h2>
      <form class="auth-form" action="dashboard.html">
        <div class="field">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" placeholder="you@example.com" required>
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input id="password" name="password" type="password" placeholder="Your password" required>
        </div>
        <button class="button primary full" type="submit">Log in</button>
      </form>
      <p class="auth-note">New here? <a href="signup.html">Create an account</a></p>
    </section>
  </main>
</body>
</html>
